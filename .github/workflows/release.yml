name: Release

# Publish a version tag as a release whose installer builds that tag from source.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the tag against the package version
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" framework/pyproject.toml
      - name: Pin the installer to this tag
        run: |
          sed -i "s/^DEFAULT_REF=main$/DEFAULT_REF=${GITHUB_REF_NAME}/" scripts/install.sh
          grep -qx "DEFAULT_REF=${GITHUB_REF_NAME}" scripts/install.sh
          sh -n scripts/install.sh
      - name: Extract the release notes from the changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v} " \
            'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' \
            CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" scripts/install.sh \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md

  windows-experimental:
    needs: release
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Resolve the packaging Python
        shell: pwsh
        run: |
          if (-not $env:pythonLocation) { throw 'actions/setup-python did not set pythonLocation.' }
          if (-not (Test-Path (Join-Path $env:pythonLocation 'python.exe'))) {
            throw "No python.exe in $env:pythonLocation."
          }
          & (Join-Path $env:pythonLocation 'python.exe') -I -c "import platform; print(platform.python_version())"
      - name: Build, 16 tests and HTTP smoke
        shell: pwsh
        run: .\scripts\build-windows-cpu.ps1 -Jobs 4
      - name: Build the experimental package
        shell: pwsh
        run: .\scripts\package-windows-cpu.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v') -PythonRuntime $env:pythonLocation
      - name: Verify without developer tools on PATH
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\*.zip | Select-Object -First 1).FullName
          .\scripts\verify-windows-package.ps1 -PackageZip $zip
      - name: Package layout and checksums
        shell: pwsh
        run: python -X utf8 tests\integration\test-windows-package.py -v
      - name: Launcher process ownership
        shell: pwsh
        run: python -X utf8 tests\integration\test-windows-server.py -v
      - name: Attach the package to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem -Path dist\*.zip, dist\*.sha256 | ForEach-Object { $_.FullName })
          gh release upload $env:GITHUB_REF_NAME @assets --clobber
